{% extends "base.html" %}

{% block title %}Student Registration{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-6 sm:my-12">
    <div class="bg-white rounded-3xl p-8 border border-slate-100 shadow-xl shadow-slate-200/50">
        <div class="text-center mb-6">
            <div class="w-12 h-12 rounded-2xl bg-indigo-50 text-indigo-600 flex items-center justify-center mx-auto mb-3">
                <i data-lucide="user-plus" class="w-6 h-6"></i>
            </div>
            <h2 class="text-2xl font-extrabold text-slate-900 tracking-tight">Student Registration</h2>
            <p class="text-xs text-slate-500 mt-1">Register your student account to access the library portal</p>
        </div>

        <form method="POST" action="{{ url_for('register') }}" class="space-y-4">
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">Full Name *</label>
                <input type="text" name="name" required placeholder="e.g. Aman Gupta" 
                       class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-sm font-medium focus:ring-2 focus:ring-indigo-500 focus:outline-none transition">
            </div>

            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">Student ID / Roll Number (Login Username) *</label>
                <input type="text" name="username" required placeholder="e.g. STU-1005 or roll no" 
                       class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-sm font-medium focus:ring-2 focus:ring-indigo-500 focus:outline-none transition">
                <span class="text-[11px] text-slate-400 mt-0.5 block">You will use this ID to log in.</span>
            </div>

            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">Phone Number</label>
                <input type="text" name="phone" placeholder="+91 9876543210" 
                       class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-sm font-medium focus:ring-2 focus:ring-indigo-500 focus:outline-none transition">
            </div>

            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">Create Password *</label>
                <input type="password" name="password" required placeholder="••••••••" 
                       class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-sm font-medium focus:ring-2 focus:ring-indigo-500 focus:outline-none transition">
            </div>

            <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm rounded-xl shadow-lg shadow-indigo-600/30 transition mt-2">
                Register Student Account
            </button>
        </form>

        <div class="mt-6 text-center pt-4 border-t border-slate-100">
            <p class="text-xs text-slate-500">
                Already registered? 
                <a href="{{ url_for('login') }}" class="font-bold text-indigo-600 hover:text-indigo-700 ml-1">
                    Sign In here
                </a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
